<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS - Techora POS</title>
    <link rel="icon" type="image/jpeg" href="../assets/images/logo.jpg">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/pos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar (Shared) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="../assets/images/logo.jpg" alt="Techora POS">
                    <span>Techora POS</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul class="nav-list">
                    <li class="nav-item"><a href="pos.html" class="nav-link"><i class="fas fa-shopping-cart"></i><span>POS</span></a></li>
                    <li class="nav-item"><a href="products.html" class="nav-link"><i class="fas fa-box"></i><span>Products</span></a></li>
                    <li class="nav-item"><a href="customers.html" class="nav-link"><i class="fas fa-users"></i><span>Customers</span></a></li>
                    <li class="nav-item"><a href="reports.html" class="nav-link"><i class="fas fa-file-alt"></i><span>Reports</span></a></li>
                    <li class="nav-item"><a href="settings.html" class="nav-link"><i class="fas fa-cog"></i><span>Settings</span></a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <img src="../assets/images/logo.jpg" alt="Avatar" class="avatar">
                    <div class="user-info">
                        <span class="user-name">Admin User</span>
                        <span class="user-role">Manager</span>
                    </div>
                    <a href="login.html" class="logout-btn" title="Logout">
                        <i class="fas fa-sign-out-alt"></i>
                    </a>
                </div>
            </div>
        </aside>

        <div class="main-wrapper">
            <!-- Top Bar (Shared) -->
            <header class="top-bar">
                <div class="top-bar-left">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="global-search" placeholder="Search products or scan barcode...">
                        <i class="fas fa-barcode" style="color: var(--text-secondary); opacity: 0.5;" title="Barcode scanner active"></i>
                    </div>
                </div>
                <div class="top-bar-right">
                    <div class="date-time" id="current-date-time">-- : --</div>
                </div>
            </header>

            <main class="content-area pos-layout">
                <!-- Product Section -->
                <div class="product-selection">
                    <div class="category-tabs" id="category-tabs">
                        <!-- Loaded via JS -->
                    </div>
                    <div class="product-grid" id="product-grid">
                        <!-- Products loaded via JS -->
                    </div>
                </div>

                <!-- Cart Section -->
                <div class="cart-panel">
                    <div class="cart-header">
                        <h2>Current Order</h2>
                        <button class="btn-clear" onclick="clearCart()">Clear</button>
                    </div>
                    
                    <div class="cart-items" id="cart-items">
                        <!-- Cart items loaded via JS -->
                        <div class="empty-cart">
                            <i class="fas fa-shopping-basket"></i>
                            <p>No items in cart</p>
                        </div>
                    </div>

                    <div class="cart-totals">
                        <div class="total-row">
                            <span>Subtotal</span>
                            <span id="subtotal-val">$0.00</span>
                        </div>
                        <div class="total-row discount-row">
                            <span>Discount (%)</span>
                            <div class="discount-input-wrapper">
                                <input type="number" id="discount-input" value="0" min="0" max="100">
                                <i class="fas fa-percent"></i>
                            </div>
                        </div>
                        <div class="total-row">
                            <span id="tax-label">Tax (10%)</span>
                            <span id="tax-val">$0.00</span>
                        </div>
                        <div class="total-divider"></div>
                        <div class="total-row grand-total">
                            <span>Total</span>
                            <span id="total-val">$0.00</span>
                        </div>
                        

                        <button class="btn-checkout" id="checkout-btn">
                            Complete Order
                        </button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/pos.js"></script>
</body>
</html>
