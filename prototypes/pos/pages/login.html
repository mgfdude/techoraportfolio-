<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Techora POS</title>
    <link rel="icon" type="image/jpeg" href="../assets/images/logo.jpg">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-page">
        <!-- Floating Decorative Shapes -->
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>

        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <img src="../assets/images/logo.jpg" alt="Techora POS Logo">
                    <span>Techora POS</span>
                </div>
                <h1>Welcome Back</h1>
                <p>Please enter your credentials to continue</p>
            </div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Enter your username" value="admin" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper password-input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" value="admin123" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="error-message" id="password-error">
                        <i class="fas fa-exclamation-circle"></i>
                        <span>The Password is wrong</span>
                    </div>
                </div>

                <div class="form-options" style="justify-content: flex-end;">
                    <a href="reset-password.html" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary btn-login">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="https://techora.in" target="_blank">Contact Admin</a></p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="../assets/js/main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalContent = submitBtn.innerHTML;
            
            // Get stored credentials or use defaults
            const auth = Storage.get('auth') || { 
                username: 'admin', 
                password: 'admin123' 
            };
            
            const VALID_USERNAME = auth.username;
            const VALID_PASSWORD = auth.password;

            // Show loading state
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Signing in...</span>';
            submitBtn.style.opacity = '0.8';
            submitBtn.disabled = true;

            // Mock login delay for better UX
            setTimeout(() => {
                if (usernameInput === VALID_USERNAME && passwordInput === VALID_PASSWORD) {
                    // Success
                    showToast('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'pos.html';
                    }, 800);
                } else {
                    // Failure
                    
                    // Reset button
                    submitBtn.innerHTML = originalContent;
                    submitBtn.style.opacity = '1';
                    submitBtn.disabled = false;
                    
                    // Add error classes
                    const passwordWrapper = document.getElementById('password').closest('.input-wrapper');
                    const usernameWrapper = document.getElementById('username').closest('.input-wrapper');
                    const passwordError = document.getElementById('password-error');
                    
                    passwordWrapper.classList.add('error');
                    usernameWrapper.classList.add('error');
                    passwordError.classList.add('visible');
                    
                    // Shake effect
                    document.querySelector('.login-card').classList.add('shake');
                    setTimeout(() => {
                        document.querySelector('.login-card').classList.remove('shake');
                    }, 500);
                }
            }, 1000);
        });

        // Clear error state on input
        document.querySelectorAll('.input-wrapper input').forEach(input => {
            input.addEventListener('input', function() {
                this.closest('.input-wrapper').classList.remove('error');
                document.getElementById('password-error').classList.remove('visible');
            });
        });
    </script>
</body>
</html>
